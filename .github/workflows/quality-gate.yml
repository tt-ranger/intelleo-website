name: Quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Unit tests
        run: node --test scripts/__tests__/*.test.mjs

      # Full run including live citation verification. This is the merge
      # gate: a fabricated or dead source URL fails the build here.
      - name: Quality gate (with citation verification)
        id: gate
        run: node scripts/quality-gate.mjs --json > gate-report.json || true

      - name: Summarise
        run: |
          node -e '
            const r = require("./gate-report.json").report.filter(x => !x.skipped);
            const failed = r.filter(x => !x.passed);
            const line = (i) => `- \`${i.code}\` ${i.message}`;
            let md = `## Quality gate\n\n${r.length} checked · ${r.length - failed.length} passed · ${failed.length} failed\n`;
            for (const a of r) {
              if (a.passed && !a.warnings.length) continue;
              md += `\n### ${a.passed ? "PASS (with warnings)" : "FAIL"} — ${a.slug}\n`;
              md += a.errors.map(line).concat(a.warnings.map(line)).join("\n") + "\n";
            }
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
            if (failed.length) process.exit(1);
          '

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-report
          path: gate-report.json
