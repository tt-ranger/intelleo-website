name: Quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: content-quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: editorial_test
          POSTGRES_PASSWORD: editorial-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d editorial_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:gate
        env:
          PUBLISH_TEST_DATABASE_URL: postgresql://postgres:editorial-test@127.0.0.1:5432/editorial_test
      - name: Validate changed articles and live citations
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          else
            base="$(git merge-base HEAD origin/main)"
          fi
          npm run gate -- --base "$base"
      - run: npm run build
